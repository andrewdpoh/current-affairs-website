name: CI

# Runs on every branch and pull request. Verifies the parsing logic offline and
# checks that the registered feeds are actually reachable — feed rot is the
# most likely way this site quietly degrades, so it is worth a standing check.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests (offline)
        run: npm test

      - name: Feed reachability check
        # Never fails the build on a single dead feed — publishers change URLs
        # and that must not block unrelated work. Read the log to see which.
        run: npm run fetch -- --dry-run

      # TEMPORARY: backfilling the Analysis section after dropping Lawfare/CFR.
      - name: Probe candidate replacements
        run: |
          npm run probe -- \
            https://www.brookings.edu/feed/ \
            https://carnegieendowment.org/rss/publications.xml \
            https://responsiblestatecraft.org/feed/ \
            https://thebulletin.org/feed/ \
            https://www.rand.org/news/press.xml \
            https://www.chathamhouse.org/rss/publications \
            https://www.iiss.org/rss/analysis \
            https://foreignaffairs.com/rss.xml \
            https://www.economist.com/international/rss.xml \
            https://www.france24.com/en/rss
