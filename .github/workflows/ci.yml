name: CI

# Runs on every branch and pull request. Verifies the parsing logic offline and
# checks that the registered feeds are actually reachable — feed rot is the
# most likely way this site quietly degrades, so it is worth a standing check.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests (offline)
        run: npm test

      - name: Feed reachability check
        # Never fails the build on a single dead feed — publishers change URLs
        # and that must not block unrelated work. Read the log to see which.
        run: npm run fetch -- --dry-run

      # TEMPORARY: probing replacements for the feeds that came back dead.
      - name: Probe candidate replacements
        run: |
          npm run probe -- \
            https://www.france24.com/en/rss \
            https://www.france24.com/en/france/rss \
            https://www.lawfaremedia.org/feed/ \
            https://www.lawfaremedia.org/rss.xml \
            https://www.csis.org/rss.xml \
            https://www.csis.org/analysis/rss \
            https://www.cfr.org/rss.xml \
            https://feeds.cfr.org/publication \
            "https://www.military.com/rss-feeds/content?keyword=&type=news" \
            https://arstechnica.com/security/feed/ \
            https://feeds.arstechnica.com/arstechnica/index \
            https://www.nato.int/cps/en/natohq/news.rss \
            https://defensescoop.com/feed/ \
            https://www.navalnews.com/feed/ \
            https://www.twz.com/feed \
            https://cyberscoop.com/feed/ \
            https://www.helpnetsecurity.com/feed/ \
            https://therecord.media/feed \
            https://www.reuters.com/arc/outboundfeeds/rss/ \
            https://apnews.com/hub/world-news.rss
